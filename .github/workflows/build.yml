name: Build APKs

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK (manual aapt2/d8 fallback works offline)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List APKs
        run: |
          ls -lh app/build/outputs/apk/debug/ || true
          ls -lh app/build/outputs/apk/release/ || true
          # Also create a combined artifacts folder
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/ 2>/dev/null || echo "no debug apk"
          cp app/build/outputs/apk/release/app-release.apk artifacts/ 2>/dev/null || echo "no release apk"
          ls -lh artifacts/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload both APKs together
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            release.keystore
            debug.keystore
            README.md
            KEYSTORE.md
          if-no-files-found: warn
