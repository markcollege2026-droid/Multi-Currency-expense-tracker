name: Build APKs

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools and platforms
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools" || true
          sdkmanager --list_installed || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lh $ANDROID_HOME/build-tools/ || true
          ls -lh $ANDROID_HOME/platforms/ || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Try real Gradle build (if dependencies available)
        id: gradle_build
        continue-on-error: true
        run: |
          # Attempt real Gradle build first (will work in GitHub Actions with Maven Central)
          # If it fails, our custom gradlew will fallback to manual aapt2 build
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --stacktrace || echo "Gradle build failed, will use manual fallback"
          else
            echo "No gradle-wrapper.jar, using manual build"
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Build Debug APK (manual aapt2/d8 fallback works offline)
        if: steps.gradle_build.outcome != 'success'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: List APKs
        run: |
          ls -lh app/build/outputs/apk/debug/ || true
          ls -lh app/build/outputs/apk/release/ || true
          # Also create a combined artifacts folder
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/ 2>/dev/null || echo "no debug apk"
          cp app/build/outputs/apk/release/app-release.apk artifacts/ 2>/dev/null || echo "no release apk"
          ls -lh artifacts/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload both APKs together
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            release.keystore
            debug.keystore
            README.md
            KEYSTORE.md
          if-no-files-found: warn
