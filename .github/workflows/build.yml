name: Build APKs
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sign_historic:
        description: >-
          One-off: sign the release APK with the historic release.keystore whose
          credentials are recovered from git history (they predate the audit that
          removed them from source). See the key-rotation issue and KEYSTORE.md.
        type: boolean
        default: false
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify-and-build:
    # Pull requests always run this workflow - including PRs from arena/*
    # branches, which used to be skipped and therefore had no checks at all.
    runs-on: ubuntu-24.04
    env:
      # Preferred source of release signing credentials once configured
      # (post key rotation). On release builds the recovered historic
      # credentials override these via GITHUB_ENV.
      SPENDINGTRACKER_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      SPENDINGTRACKER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      SPENDINGTRACKER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME PATH=$PATH" | tee build.log
          command -v sdkmanager || true
          ls /usr/local/lib/android/sdk/cmdline-tools/ || true
          if command -v sdkmanager >/dev/null; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee -a build.log
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      # Signing for releases: until the release key is rotated (issue #22), the
      # standing policy is that ALL releases are signed with the historic key
      # (release.keystore with the credentials that are recoverable from git
      # history - they predate the audit that removed them from source; that
      # history exposure is exactly why the key must rotate). The recovered
      # values go to the gitignored signing.properties and are only used when
      # no SPENDINGTRACKER_* env/secrets are configured; values are never
      # echoed. STANDING POLICY (until explicitly changed - see README and the
      # key-rotation issue): EVERY run recovers the historic key and signs the
      # release APK with it, so each run produces a historically signed APK.
      - name: Recover historic signing credentials from git history
        run: |
          set -euo pipefail
          # Full object name: abbreviated SHAs cannot be fetched, and the
          # depth-1 tip of main moves as PRs merge (this used to work only
          # because main happened to point at this commit).
          src=888367730833af06d77c5528973d2167d8aa5832
          if ! git cat-file -e "$src:app/build.gradle.kts" 2>/dev/null; then
            git fetch --depth=1 origin "$src" 2>/dev/null || git fetch --depth=200 origin main
          fi
          gf=$(git show "$src:app/build.gradle.kts")
          sp=$(grep -oP 'storePassword\s*=\s*"\K[^"]+' <<<"$gf" | head -1)
          ka=$(grep -oP 'keyAlias\s*=\s*"\K[^"]+' <<<"$gf" | head -1)
          kp=$(grep -oP 'keyPassword\s*=\s*"\K[^"]+' <<<"$gf" | head -1)
          test -n "$sp" && test -n "$ka" && test -n "$kp"
          {
            echo "releaseStoreFile=release.keystore"
            echo "releaseStorePassword=$sp"
            echo "releaseKeyAlias=$ka"
            echo "releaseKeyPassword=$kp"
          } > signing.properties
          # Belt and braces: also export them as environment variables for the
          # build step (env-file wins over job env; values are never echoed).
          {
            echo "SPENDINGTRACKER_STORE_FILE=release.keystore"
            echo "SPENDINGTRACKER_STORE_PASSWORD=$sp"
            echo "SPENDINGTRACKER_KEY_ALIAS=$ka"
            echo "SPENDINGTRACKER_KEY_PASSWORD=$kp"
          } >> "$GITHUB_ENV"
          echo "::warning::Historic signing credentials recovered (signing.properties: $(wc -c < signing.properties) bytes; keys: store=$([ -n "$sp" ] && echo yes) alias=$([ -n "$ka" ] && echo yes) keypass=$([ -n "$kp" ] && echo yes))."
      - name: Test and compile signed APKs
        # Signing: env (secrets or the recovered historic credentials via
        # GITHUB_ENV) > signing.properties > Gradle properties. When none are
        # configured the release build compiles unsigned and the publish steps
        # below refuse to publish it. See KEYSTORE.md.
        run: |
          set -o pipefail
          if [ -f signing.properties ]; then
            echo "::warning::signing.properties present ($(wc -c < signing.properties) bytes) - release build should be signed"
          else
            echo "::warning::no signing.properties - release build will be unsigned (unexpected: historic credential recovery should have run)"
          fi
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease \
            -PGIT_SHA="${{ github.sha }}" \
            --no-daemon --no-parallel --max-workers=1 --stacktrace 2>&1 | tee -a build.log

      # Proves what the artifacts are, from the APK itself rather than from the
      # gradle file: versionCode/versionName are read back out of the built APK and
      # compared with app/build.gradle.kts, and the commit SHA is recorded next to
      # the APKs. A stale/resurrected artifact can no longer pass silently.
      # Proves what the artifacts are, from the APK itself rather than from the
      # gradle file. Two things are checked:
      #   1. identity  - versionCode/versionName read back out of the APK, and the
      #                  debug package name, must match the source.
      #   2. content   - marker strings from the newest UI work must be present in
      #                  the debug DEX, so an artifact built before that work cannot
      #                  be published under a newer version number.
      - name: Verify the built APK matches this commit
        run: |
          set -euo pipefail
          # Without signing secrets AGP names the release artifact
          # app-release-unsigned.apk; verification must work either way.
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            apk=app/build/outputs/apk/release/app-release-unsigned.apk
          fi
          if [ ! -f "$apk" ]; then
            echo "::error::no release APK found under app/build/outputs/apk/release/"; ls -l app/build/outputs/apk/release/ || true; exit 1
          fi
          echo "release artifact: $apk" | tee -a build.log
          dbg=app/build/outputs/apk/debug/app-debug.apk
          expected_code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          expected_name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)

          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$bt" ] && [ -x "${bt}aapt" ]; then
            aapt="${bt}aapt"
          elif command -v aapt >/dev/null; then
            aapt=aapt
          else
            echo "::error::aapt not found; cannot verify the artifacts"; exit 1
          fi
          echo "using $aapt" | tee -a build.log

          "$aapt" dump badging "$apk" > release-badging.txt
          "$aapt" dump badging "$dbg" > debug-badging.txt
          code=$(grep -oP "versionCode='\K[0-9]+" release-badging.txt | head -1)
          name=$(grep -oP "versionName='\K[^']+" release-badging.txt | head -1)
          dcode=$(grep -oP "versionCode='\K[0-9]+" debug-badging.txt | head -1)
          dname=$(grep -oP "versionName='\K[^']+" debug-badging.txt | head -1)
          dpkg=$(grep -oP "^package: name='\K[^']+" debug-badging.txt | head -1)
          echo "release: code=$code name=$name" | tee -a build.log
          echo "debug:   code=$dcode name=$dname package=$dpkg" | tee -a build.log
          test "$code" = "$expected_code" || { echo "::error::release APK versionCode $code != $expected_code"; exit 1; }
          test "$name" = "$expected_name" || { echo "::error::release APK versionName $name != $expected_name"; exit 1; }
          test "$dcode" = "$expected_code" || { echo "::error::debug APK versionCode $dcode != $expected_code"; exit 1; }
          test "$dpkg" = "com.spendingtracker.app.debug" || { echo "::error::debug APK package $dpkg is not the side-by-side build"; exit 1; }

          # Content markers. Each one is a user-visible string introduced by work
          # that must be inside this build; a missing marker means a stale
          # artifact. Checked in the debug APK (nothing stripped, so this also
          # catches "the source never had it") AND in the release APK (R8 ran, so
          # this catches "the shrinker removed it"): the release APK is what gets
          # installed, so it has to be checked directly, not inferred.
          tmp=$(mktemp -d)
          dexdump() {
            rm -rf "$tmp/x"; mkdir -p "$tmp/x"
            unzip -q -o "$1" 'classes*.dex' -d "$tmp/x"
            cat "$tmp/x"/classes*.dex > "$2"
          }
          dexdump "$dbg" "$tmp/debug.dex"
          dexdump "$apk" "$tmp/release.dex"

          missing=""
          check() {
            label=$1; shift
            for marker in "$@"; do
              where=""
              for f in "$tmp/debug.dex" "$tmp/release.dex"; do
                grep -aqF -- "$marker" "$f" || where="$where ${f##*/}"
              done
              if [ -z "$where" ]; then
                echo "marker present in both APKs: $label ($marker)" | tee -a build.log
              else
                echo "::error::marker missing from$where: $label ($marker)"
                missing="$missing [$label]"
              fi
            done
          }
          check "refusal toast"      "Still busy: "
          check "rate refresh"       "Refreshing rates"
          check "settle labels"      "Recording payment" "Settling through a balance"
          # Paying a loan in another currency: the equivalent line, the "Pay in"
          # selector are the visible parts of that change.
          check "pay in any currency" "comes off the loan" "PAY IN" " (loan currency)" "covers it"
          check "account delete label" "Deleting "
          # The composables themselves. AppFeedback.kt compiles to AppFeedbackKt,
          # which the debug APK keeps under that name. R8 renames classes in the
          # release APK, so a class-name grep there proves nothing either way; the
          # release-side evidence is the string markers above, because R8 drops a
          # string constant together with the code that used it. The R8 mapping is
          # reported for traceability only.
          grep -aqF "AppFeedbackKt" "$tmp/debug.dex" || { echo "::error::AppFeedbackKt missing from debug APK"; missing="$missing [AppFeedbackKt]"; }

          # AppLock auto-lock exemption: the application-level manifest marker
          # must be in the merged manifest of BOTH shipped APKs with value true.
          for apkcheck in "$dbg" "$apk"; do
            "$aapt" dump xmltree "$apkcheck" AndroidManifest.xml > "$tmp/manifest.xml"
            if ! grep -qF 'dev.pranav.applock.AUTOLOCK_EXEMPT' "$tmp/manifest.xml"; then
              echo "::error::AUTOLOCK_EXEMPT missing from the manifest of $apkcheck"; missing="$missing [AUTOLOCK_EXEMPT]"
            elif ! grep -B2 -A2 -F 'dev.pranav.applock.AUTOLOCK_EXEMPT' "$tmp/manifest.xml" | grep -qiE 'value.*(true|0xffffffff)'; then
              echo "::error::AUTOLOCK_EXEMPT present in $apkcheck but its value is not Boolean true"; missing="$missing [AUTOLOCK_EXEMPT-value]"
            else
              echo "manifest marker present: $apkcheck (dev.pranav.applock.AUTOLOCK_EXEMPT=true)" | tee -a build.log
            fi
          done
          echo "release minification: $(grep -oE 'isMinifyEnabled = [a-z]+' app/build.gradle.kts | tail -1)" | tee -a build.log
          mapping=app/build/outputs/mapping/release/mapping.txt
          if [ -s "$mapping" ]; then
            echo "R8 mapping: $(wc -l < "$mapping") lines, $(grep -c 'AppFeedbackKt' "$mapping" || true) AppFeedbackKt reference(s)" | tee -a build.log
            grep 'AppFeedbackKt' "$mapping" | head -3 | tee -a build.log || true
          else
            echo "no R8 mapping at $mapping; mapping files present:" | tee -a build.log
            find app/build/outputs -name 'mapping*' | head -5 | tee -a build.log
          fi
          if [ -n "$missing" ]; then
            echo "::error::APK is missing expected content:$missing"; exit 1
          fi

          {
            echo "versionName: $name"
            echo "versionCode: $code"
            echo "debugVersionName: $dname"
            echo "debugPackage: $dpkg (installs beside the release build)"
            echo "gitCommit:   ${{ github.sha }}"
            echo "gitRef:      ${{ github.ref_name }}"
            echo "runId:       ${{ github.run_id }}"
            echo "builtAt:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "releaseApk:  $(sha256sum "$apk" | cut -d' ' -f1)"
            echo "releaseApkFile: $(basename "$apk")"
            echo "debugApk:    $(sha256sum "$dbg" | cut -d' ' -f1)"
            echo "contentMarkers: verified in both debug and release APKs (busy labels, refusal toast) + AppFeedbackKt kept by R8"
          } | tee BUILD-INFO.txt
          cp BUILD-INFO.txt app/build/outputs/apk/release/BUILD-INFO.txt

      - name: Post build info
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Built artifact'
            echo '```'
            cat BUILD-INFO.txt
            echo '```'
            echo 'The installed app shows the same version and commit in Settings (Data -> Version).'
          } > build-info.json
          jq -Rs '{body: .}' build-info.json > build-info-post.json
          gh api "repos/$GITHUB_REPOSITORY/commits/${{ github.sha }}/comments" --input build-info-post.json --jq .html_url
      - name: Publish verification metadata
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/build_report.py
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input build-report.json --jq .html_url
      - name: Check upgrade compatibility against v1.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify_upgrade.sh
      # The tag used to be hardcoded, so any later [release] push would overwrite
      # v1.8.1. Read it from the module instead.
      - name: Read app version
        id: appver
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      # STANDING POLICY (until explicitly changed - see README): every run
      # stages the release APK signed with the historic key and uploads it as
      # the `signed-release-apk-legacy-key` run artifact, so a historically
      # signed APK is always one download away.
      - name: Stage the historic-key signed release APK
        run: |
          set -euo pipefail
          mkdir -p signed-out
          cp app/build/outputs/apk/release/app-release.apk \
            "signed-out/SpendingTracker-${{ steps.appver.outputs.version }}-legacy-key-signed.apk"
          sha256sum signed-out/*.apk | tee -a build.log
      - uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk-legacy-key
          path: signed-out/
          if-no-files-found: error
      # Dispatch-gated extra: additionally publish the historically signed APK
      # as its own GitHub pre-release, separate from the regular artifacts.
      - name: Publish the historic-key signed APK separately
        if: github.event_name == 'workflow_dispatch' && inputs.sign_historic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.appver.outputs.version }}"
          asset="SpendingTracker-$version-legacy-key-signed.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          echo "sha256: $(sha256sum "$asset" | cut -d' ' -f1)" | tee -a build.log
          mkdir -p signed-out && cp "$asset" signed-out/
          tag="legacy-key-signed-v$version"
          notes="One-off build signed with the app's historic release key (release.keystore).
          Built from $GITHUB_SHA on $GITHUB_REF; signer certificate matched against v1.8.0 by the upgrade check in this run.
          The key needs ROTATING: its credentials were in source control and remain in git history (see the key-rotation issue and KEYSTORE.md).
          SHA-256: $(sha256sum "$asset" | cut -d' ' -f1)"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" --prerelease --target "$GITHUB_SHA" \
              --title "Spending Tracker v$version — signed with the legacy release key (one-off)" \
              --notes "$notes"
          fi
      # Publishing an unsigned artifact would silently change the app's signing
      # identity for every installer. Releases require configured secrets.
      - name: Require signed release APK before publishing
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        run: |
          set -euo pipefail
          ls -la app/build/outputs/apk/release/ | tee -a build.log
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then apk=app/build/outputs/apk/release/app-release-unsigned.apk; fi
          # Deterministic toolchain (matches verify_upgrade.sh): the newest
          # build-tools dir on the runner image may be a preview whose apksigner
          # is not reliable.
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$tools/apksigner" ]; then
            bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1); tools="${bt%/}"
          fi
          if ! "$tools/apksigner" verify --print-certs "$apk" > apksigner-out.txt 2>&1; then
            cat apksigner-out.txt | tee -a build.log
            echo "::error::Release APK ($apk) failed apksigner verify - refusing to publish. Configure the RELEASE_* secrets (or the signing.properties fallback) to sign releases."
            exit 1
          fi
          cat apksigner-out.txt | tee -a build.log
          grep 'Signer #1 certificate SHA-256 digest:' apksigner-out.txt | tee -a build.log
      - name: Publish requested release
        id: publish
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.appver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Spending Tracker v${{ steps.appver.outputs.version }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            BUILD-INFO.txt
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
      # Regression guard: v1.12.0 was published with the tag still pointing at an
      # earlier commit, so "Source code" on the release page and the uploaded APKs
      # disagreed. Publishing is only correct when the tag resolves to this SHA.
      - name: Verify the release tag points at this commit
        if: steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.appver.outputs.tag }}"
          remote_sha=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
          if [ -z "$remote_sha" ]; then
            echo "::error::tag $tag does not exist on the remote"; exit 1
          fi
          if [ "$remote_sha" != "${{ github.sha }}" ]; then
            echo "::error::tag $tag points at $remote_sha but this build is ${{ github.sha }}"
            exit 1
          fi
          echo "tag $tag -> $remote_sha (this commit)" | tee -a build.log

      - name: Report build failure on commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/failure_report.py
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$(cat failure-summary.md)" || true
      - uses: actions/upload-artifact@v4
        with:
          name: spending-tracker-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            BUILD-INFO.txt
            app/schemas/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
