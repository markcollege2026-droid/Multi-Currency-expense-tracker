name: Build APKs

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK (use preinstalled + install needed for Android 15)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -lh $ANDROID_HOME/build-tools/ || true
          ls -lh $ANDROID_HOME/platforms/ || true
          # Install both API 34 and 35 for recent Android compatibility (Android 14 & 15)
          sdkmanager --install "build-tools;35.0.0" "build-tools;34.0.0" "platforms;android-35" "platforms;android-34" "platform-tools" || true
          sdkmanager --list_installed | grep -E "build-tools|platforms" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace
          ls -lh app/build/outputs/apk/release/ || true

      - name: Copy APKs to apk/ folder
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/ || true
          cp app/build/outputs/apk/release/app-release.apk apk/ || true
          ls -lh apk/

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            apk/app-debug.apk
            apk/app-release.apk
            release.keystore
            debug.keystore
            README.md
            KEYSTORE.md
          if-no-files-found: warn
