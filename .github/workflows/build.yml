name: Build APKs
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME PATH=$PATH" | tee build.log
          command -v sdkmanager || true
          ls /usr/local/lib/android/sdk/cmdline-tools/ || true
          if command -v sdkmanager >/dev/null; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee -a build.log
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Test and compile signed APKs
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee -a build.log
      - name: Publish verification metadata
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/build_report.py
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input build-report.json --jq .html_url
      - name: Report build failure on commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$(tail -c 45000 build.log)"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: spending-tracker-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/schemas/**
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
