name: Build APKs

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-full-app:
    name: Build Full App (Real Gradle - Full Features)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK for Full App (API 34 & 35)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "build-tools;35.0.0" "build-tools;34.0.0" "platforms;android-35" "platforms;android-34" "platform-tools" || true
          sdkmanager --list_installed | grep -E "build-tools|platforms" || true
          yes | sdkmanager --licenses || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties && cat local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew && ls -lh gradle/wrapper/

      - name: Build Full App Debug (Real Gradle - MUST produce >1MB APK)
        id: real_build
        continue-on-error: true
        run: |
          echo "=== Building FULL APP via Real Gradle (not demo) ===" | tee build.log
          echo "This should produce 20-50MB APK with Compose/Room/Hilt" | tee -a build.log
          java -jar gradle/wrapper/gradle-wrapper.jar assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m" 2>&1 | tee -a build.log
          echo "=== Build finished, checking APK ===" | tee -a build.log
          ls -lh app/build/outputs/apk/debug/ 2>&1 | tee -a build.log || true
          SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || stat -f%z app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || echo 0)
          echo "APK size: $SIZE bytes" | tee -a build.log
          if [ "$SIZE" -gt 1000000 ]; then
            echo "FULL_APP=true" >> $GITHUB_ENV
            echo "Real Gradle build succeeded - full app!" | tee -a build.log
          else
            echo "FULL_APP=false" >> $GITHUB_ENV
            echo "APK is demo size or missing, real Gradle may have failed" | tee -a build.log
          fi
          # Also try to find any APK
          find app/build -name "*.apk" -ls 2>&1 | tee -a build.log || true

      - name: Show Build Log on Failure
        if: env.FULL_APP != 'true'
        run: |
          echo "=== BUILD LOG (last 200 lines) ==="
          tail -n 200 build.log || true
          echo "=== Trying to find errors ==="
          grep -i "error\|failed\|exception" build.log | tail -n 100 || true
          echo "=== Checking for common issues ==="
          cat app/build.gradle.kts | head -n 50 || true
          ls -lh app/build/outputs/ || true
          find app/build -type f | head -n 50 || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-full-app
          path: build.log
          if-no-files-found: warn

      - name: Fallback to Manual Demo Build if Real Gradle Failed
        if: env.FULL_APP != 'true'
        run: |
          echo "Real Gradle did not produce full app, falling back to manual demo build (compatible with Android 14/15+)"
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/ || true

      - name: Copy APKs to apk/ folder
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/app-debug.apk || true
          cp app/build/outputs/apk/release/app-release.apk apk/app-release.apk || true
          ls -lh apk/
          echo "=== APK Details ==="
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/ || true
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            if [ -f "$apk" ]; then
              SIZE=$(stat -c%s "$apk" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 1000000 ]; then
                echo "$apk is FULL APP ($SIZE bytes)"
              else
                echo "$apk is DEMO ($SIZE bytes) - real Gradle may have failed"
              fi
            fi
          done

      - name: Upload Full App Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-full
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload Full App Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-full
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload All APKs + Docs
        uses: actions/upload-artifact@v4
        with:
          name: all-apks-full
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            apk/app-debug.apk
            apk/app-release.apk
            release.keystore
            debug.keystore
            README.md
            KEYSTORE.md
          if-no-files-found: warn

  build-demo:
    name: Build Demo APK (Manual aapt2/d8 - Offline Fallback)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          sdkmanager --install "build-tools;35.0.0" "build-tools;34.0.0" "platforms;android-35" "platforms;android-34" "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Demo APKs (Manual - Always works offline, recent Android)
        run: |
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/

      - name: Upload Demo APKs
        uses: actions/upload-artifact@v4
        with:
          name: demo-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
