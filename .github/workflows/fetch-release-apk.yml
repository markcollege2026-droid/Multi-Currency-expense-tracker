name: Fetch release APK to branch
on:
  push:
    branches:
      - arena/de035df3-multi-currency-expense-tracker
    paths:
      - release-apk/.fetch

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/de035df3-multi-currency-expense-tracker
      - name: Download signed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-apk
          gh release download v1.10.0 --pattern 'app-release.apk' --pattern 'SHA256SUMS.txt' --dir release-apk --clobber
          (cd release-apk && sha256sum -c SHA256SUMS.txt)
      - name: Commit APK to branch
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add release-apk/
          git commit -m "[skip ci] Fetch signed v1.10.0 release APK for delivery"
          git push origin arena/de035df3-multi-currency-expense-tracker
