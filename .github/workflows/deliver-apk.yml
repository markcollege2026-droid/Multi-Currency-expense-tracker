name: Deliver Release APK
# Copies the signed release APK from a previous "Build APKs" run into a
# delivery/ commit on the current branch so it can be fetched over plain git
# (CI artifact storage is not reachable from every environment).
on:
  workflow_dispatch:
    inputs:
      runId:
        description: Build APKs run ID to copy the release APK from
        required: true
permissions:
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download APK from the build run
        uses: actions/download-artifact@v4
        with:
          name: spending-tracker-apks
          run-id: ${{ inputs.runId }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage APK under delivery/
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/release/app-release.apk delivery/app-release-v1.9.0.apk
          cp app/build/outputs/apk/release/SHA256SUMS.txt delivery/SHA256SUMS.txt
          ls -la delivery
      - name: Commit and push delivery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add delivery/
          if git diff --cached --quiet; then
            echo "Delivery already up to date"
          else
            git commit -m "chore: deliver signed release APK"
            git push
          fi
