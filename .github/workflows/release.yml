name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v1.0)'
        required: false
        default: 'v1.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          cache-disabled: false

      - name: Setup Android SDK (Android 15 compatible)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "build-tools;35.0.0" "build-tools;34.0.0" "platforms;android-35" "platforms;android-34" "platform-tools" || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Full App (debug APK, release APK + Play AAB)
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m" 2>&1 | tee build.log
          ls -lh app/build/outputs/apk/debug/ app/build/outputs/apk/release/ app/build/outputs/bundle/release/
          SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || echo 0)
          echo "Debug APK size: $SIZE"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: APK too small, expected full app >1MB"
            exit 1
          fi

      - name: Copy to apk folder
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk apk/app-release.apk

      - name: Create Release with Full App APKs + Play AAB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name || 'v1.0' }}
          name: Spending Tracker ${{ github.event.inputs.tag || github.ref_name || 'v1.0' }} - Full App
          body: |
            Offline-first Spending Tracker + Loans & Debts - FULL APP (v1.2)

            **New in this release:**
            - Multiple accounts per device (own currency, starting balance,
              low-balance threshold); switch accounts from Home. Expenses and
              top-ups are tracked per account. Loans & debts stay SHARED
              across accounts.
            - Recurring payments (daily/weekly/monthly/yearly) with chosen
              due dates, start/end dates, pause/resume. Due payments post
              automatically as expenses, converted at execution time; missed
              occurrences are caught up, missing rates retry (never guessed).
            - Loans: pick any due date (date picker), and see the date each
              loan/debt was made.
            - Custom categories: create (with color) and delete in the
              category picker.
            - Export/import JSON covers accounts + recurring payments; old
              export files still import.

            **Full App Features (Real Gradle Build):**
            - Compose + Material 3 dynamic color
            - Room DB offline-first (9 entities)
            - Hilt DI, Navigation, ViewModels
            - Balance = starting + topups - converted expenses (BigDecimal)
            - Multi-currency with cached rates from open.er-api.com
            - Loans & Debts separate from balance with repayments, progress, overdue
            - Dashboard with balance card, stats, trend, quick-add FAB
            - Transactions grouped by day with search/filters
            - Settings with accounts management, export/import JSON/CSV, erase, theme, threshold
            - WorkManager notifications + daily recurring payments

            **Performance:**
            - R8 code + resource shrinking enabled for release
            - Strong-skipping Compose compiler
            - Baseline-profile ready (profileinstaller)

            **Compatibility:**
            - minSdk 26 (Android 8), targetSdk 35 (Android 15)
            - v2+v3 signing for Android 14/15+

            **Artifacts:**
            - app-debug.apk (full app, debug)
            - app-release.apk (full app, release signed with release.keystore)
            - app-release.aab (Play Store bundle - upload this to Google Play Console)
            - mapping/ (R8 crash deobfuscation mapping)

            Install APK via adb or file manager. For Google Play, upload the AAB.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            release.keystore
            README.md
            KEYSTORE.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
