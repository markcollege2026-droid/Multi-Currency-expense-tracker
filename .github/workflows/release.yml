name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name for release (e.g. v1.0)'
        required: false
        default: 'v1.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "platform-tools" || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug and Release APKs
        run: |
          ./gradlew assembleDebug
          ./gradlew assembleRelease
          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/apk/release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name || 'v1.0' }}
          name: Spending Tracker ${{ github.event.inputs.tag || github.ref_name || 'v1.0' }}
          body: |
            Offline-first Spending Tracker + Loans & Debts
            
            - Balance = starting + topups - converted expenses (BigDecimal)
            - Multi-currency with cached rates from open.er-api.com
            - Loans & Debts separate from balance
            - Material 3 UI
            
            APKs:
            - app-debug.apk (debug)
            - app-release.apk (signed with release.keystore, pass: spendingtracker)
            
            Install via adb or file manager.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            apk/app-debug.apk
            apk/app-release.apk
            release.keystore
            README.md
            KEYSTORE.md
          draft: false
          prerelease: false
