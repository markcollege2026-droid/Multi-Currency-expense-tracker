name: Release APKs
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (leave blank for v<versionName> from app/build.gradle.kts)"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  build-and-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: |
          echo "ANDROID_HOME=$ANDROID_HOME JAVA_HOME=$JAVA_HOME PATH=$PATH" | tee build.log
          command -v sdkmanager || true
          ls /usr/local/lib/android/sdk/cmdline-tools/ || true
          if command -v sdkmanager >/dev/null; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee -a build.log
          fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Verify and compile
        # Release signing credentials come from GitHub Actions secrets (see
        # KEYSTORE.md). Without them the release APK is unsigned and the
        # publish step below refuses to release it.
        env:
          SPENDINGTRACKER_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SPENDINGTRACKER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SPENDINGTRACKER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --no-daemon --no-parallel --max-workers=1 --stacktrace 2>&1 | tee -a build.log
      - name: Report build failure on commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f build.log ]; then gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$(tail -c 45000 build.log)"; fi
      - name: Verify upgrade compatibility against v1.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify_upgrade.sh
      # The tag defaults to v<versionName> of the app module, so the workflow
      # can never silently publish under a stale version number again.
      - name: Resolve release tag
        id: appver
        run: |
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="v$version"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Require signed release APK before publishing
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          if ! "${bt}apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk >/dev/null 2>&1; then
            echo "::error::Release APK is unsigned. Configure the RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD repository secrets to publish a release."
            exit 1
          fi
          "${bt}apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep 'Signer #1 certificate SHA-256 digest:'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.appver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Spending Tracker ${{ steps.appver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-reports
          path: app/build/reports/
